<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;white-space:pre}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.fade{opacity:0;animation:fade .6s ease forwards}
.flow{stroke-dasharray:3 5;animation:flow 1.2s linear infinite}
@keyframes fade{to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-16}}

.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rot{opacity:0;animation:rot 12s infinite}
@keyframes rot{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
</style>

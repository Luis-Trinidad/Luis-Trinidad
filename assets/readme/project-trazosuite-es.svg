.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
.fade{opacity:0;animation:fade .6s ease forwards}
.flow{stroke-dasharray:3 5;animation:flow 1.2s linear infinite}
